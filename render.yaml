databases:
  - name: centro-operaciones-ti-db
    plan: free
    databaseName: centro_operaciones_ti
    user: centro_operaciones_ti

services:
  - type: web
    name: centro-operaciones-ti
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python preparar_produccion.py && python servidor_wsgi.py
    healthCheckPath: /salud
    envVars:
      - key: ENTORNO
        value: produccion
      - key: ENTORNO_ACADEMICO
        value: "true"
      - key: ROTAR_CREDENCIALES_INICIALES
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: centro-operaciones-ti-db
          property: connectionString
      - key: CLAVE_INICIAL_OPERADOR
        sync: false
      - key: CLAVE_INICIAL_SUPERVISOR
        sync: false
